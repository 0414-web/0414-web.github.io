<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>문경 학사 식사 신청</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #f9fafb;
    }
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>

  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.263.1"
  }
}
</script>
</head>
<body class="pb-20">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo } from 'react';
    import { createRoot } from 'react-dom/client';
    import { ChevronLeft, ChevronRight, Check, LogIn, LogOut, X, User as UserIcon } from 'lucide-react';

    // --- Firebase 라이브러리 가져오기 ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // --- Firebase 설정 및 초기화 ---
    const firebaseConfig = {
      apiKey: "AIzaSyCwIp4CA2P41CBOzirB6dTrOTzMO4DWYpA",
      authDomain: "list-03-1efd8.firebaseapp.com",
      projectId: "list-03-1efd8",
      storageBucket: "list-03-1efd8.firebasestorage.app",
      messagingSenderId: "73291844896",
      appId: "1:73291844896:web:802e4821e16313eee0db45"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // --- Constants & Types ---
    const TimeSlot = {
      MORNING: '아침(07:00)',
      LUNCH: '점심(12:00)',
      DINNER: '저녁(19:00)',
    };

    const TIME_SLOTS = [TimeSlot.MORNING, TimeSlot.LUNCH, TimeSlot.DINNER];

    const MALE_ADDITIONAL_NAMES = [
      '권효상', '고해주', '이평화', '황민서', '홍석환', '김강산', '황언수', '김승빈', '김한섭', '김준길',
      '서희원', '이해성', '황규승', '김태헌', '정태우'
    ];

    const FEMALE_ADDITIONAL_NAMES = [
      '윤다해', '임은수', '박수진', '신보경', '배민영', '안연수', '이소희',
      '장원영', '강민주', '김수란', '권효은', '윤혜경', '최수안',
      '유수민', '박나혜', '강세진', '채지혜', '김호진', '김지우', '김예림'
    ];

    const createUsers = (names, gender, idPrefix) => {
      return names.map((name, index) => ({
        id: `${idPrefix}-${index}`,
        name,
        avatarColor: gender === 'male' ? 'bg-blue-100 text-blue-600' : 'bg-pink-100 text-pink-600',
        gender,
      }));
    };

    // 사감님, 어머님은 PIN 로그인 없이 누구나 신청 가능한 공용 계정입니다.
    const PUBLIC_NAMES = ['사감님', '어머님'];

    const USERS = [
      { id: '1', name: '사감님', avatarColor: 'bg-blue-100 text-blue-600', gender: 'male' },
      { id: '2', name: '어머님', avatarColor: 'bg-pink-100 text-pink-600', gender: 'female' },
      ...createUsers(MALE_ADDITIONAL_NAMES, 'male', 'male-custom'),
      ...createUsers(FEMALE_ADDITIONAL_NAMES, 'female', 'female-custom'),
    ];

    // 로그인 모달에서 선택 가능한 목록 (공용 계정 제외)
    const LOGIN_SELECTABLE_USERS = USERS.filter(u => !PUBLIC_NAMES.includes(u.name));

    // --- Utils ---
    const formatDate = (date) => {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };

    const isRegistrationAllowed = (targetDateStr, slot) => {
      const now = new Date();
      const todayStr = formatDate(now);
      
      // 1. Past dates are closed
      if (targetDateStr < todayStr) return false;

      // 2. Too far in future (more than 7 days)
      const targetDate = new Date(targetDateStr);
      const maxDate = new Date(now);
      maxDate.setDate(now.getDate() + 7);
      const maxDateStr = formatDate(maxDate);
      
      if (targetDateStr > maxDateStr) return false;

      // 3. If today, check time
      if (targetDateStr === todayStr) {
        const currentHour = now.getHours();
        // Morning: until 5am (05:00)
        if (slot === TimeSlot.MORNING && currentHour >= 5) return false;
        // Lunch: until 10am (10:00)
        if (slot === TimeSlot.LUNCH && currentHour >= 10) return false;
        // Dinner: until 5pm (17:00)
        if (slot === TimeSlot.DINNER && currentHour >= 17) return false;
      }

      return true;
    };

    const getDisplayDate = (date) => {
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      return {
        dayName: days[date.getDay()],
        dateNum: String(date.getDate()),
        fullDate: formatDate(date),
      };
    };

    const getWeekDays = (startDate) => {
      const dates = [];
      const start = new Date(startDate);
      for (let i = 0; i < 7; i++) {
        const nextDay = new Date(start);
        nextDay.setDate(start.getDate() + i);
        dates.push(nextDay);
      }
      return dates;
    };

    // --- Components ---

    const WeekCalendar = ({ selectedDate, onSelectDate, startDate, onPrevWeek, onNextWeek }) => {
      const days = getWeekDays(startDate);

      return (
        <div className="bg-white shadow-sm border-b sticky top-[73px] z-10">
          <div className="max-w-md mx-auto px-4 py-4">
            <div className="flex items-center justify-between mb-4">
              <button 
                onClick={onPrevWeek}
                className="p-1 rounded-full hover:bg-gray-100 text-gray-500 transition-colors"
              >
                <ChevronLeft size={20} />
              </button>
              <h2 className="text-lg font-bold text-gray-800">
                {startDate.getMonth() + 1}월 {Math.ceil(startDate.getDate() / 7)}주차 일정
              </h2>
              <button 
                onClick={onNextWeek}
                className="p-1 rounded-full hover:bg-gray-100 text-gray-500 transition-colors"
              >
                <ChevronRight size={20} />
              </button>
            </div>
            
            <div className="flex justify-between space-x-2 overflow-x-auto pb-2 scrollbar-hide">
              {days.map((date) => {
                const { dayName, dateNum, fullDate } = getDisplayDate(date);
                const isSelected = selectedDate === fullDate;
                const isSunday = date.getDay() === 0;
                const isSaturday = date.getDay() === 6;

                let textColor = 'text-gray-600';
                if (isSunday) textColor = 'text-red-500';
                if (isSaturday) textColor = 'text-blue-500';
                if (isSelected) textColor = 'text-white';

                return (
                  <button
                    key={fullDate}
                    onClick={() => onSelectDate(fullDate)}
                    className={`flex flex-col items-center justify-center min-w-[3.5rem] py-3 rounded-2xl transition-all duration-200 ${
                      isSelected
                        ? 'bg-indigo-600 shadow-md transform scale-105'
                        : 'bg-gray-50 hover:bg-gray-100'
                    }`}
                  >
                    <span className={`text-xs font-medium mb-1 ${isSelected ? 'text-indigo-200' : 'text-gray-400'}`}>
                      {dayName}
                    </span>
                    <span className={`text-lg font-bold ${textColor}`}>
                      {dateNum}
                    </span>
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      );
    };

    const DailyTable = ({ users, dailyData, selectedDate, onToggle, currentUser }) => {
      const stats = useMemo(() => {
        const slotStats = {
          [TimeSlot.MORNING]: { total: 0, male: 0, female: 0 },
          [TimeSlot.LUNCH]: { total: 0, male: 0, female: 0 },
          [TimeSlot.DINNER]: { total: 0, male: 0, female: 0 },
        };

        users.forEach(user => {
          TIME_SLOTS.forEach(slot => {
            if (dailyData[user.name]?.[slot]) {
              if (user.gender === 'male') {
                slotStats[slot].male++;
              } else {
                slotStats[slot].female++;
              }
              slotStats[slot].total++;
            }
          });
        });

        return { slotStats };
      }, [users, dailyData]);

      return (
        <div className="flex flex-col space-y-4">
          <div className="grid grid-cols-3 gap-2">
            {TIME_SLOTS.map((slot) => (
              <div key={slot} className="bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center justify-center">
                 <span className="text-xs font-bold text-gray-500 mb-1">{slot}</span>
                 <div className="text-xl font-extrabold text-gray-800 leading-none mb-2">
                   {stats.slotStats[slot].total}
                 </div>
                 <div className="flex items-center gap-2 text-[11px] font-medium">
                    <span className="text-blue-500 bg-blue-50 px-1.5 py-0.5 rounded">남 {stats.slotStats[slot].male}</span>
                    <span className="text-pink-500 bg-pink-50 px-1.5 py-0.5 rounded">여 {stats.slotStats[slot].female}</span>
                 </div>
              </div>
            ))}
          </div>

          <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col">
            <div className="overflow-x-auto">
              <table className="w-full text-sm text-left border-collapse min-w-[320px]">
                <thead className="bg-gray-50 text-gray-500 font-medium border-b border-gray-200">
                  <tr>
                    <th className="px-3 py-3 w-28 whitespace-nowrap text-center text-xs">이름</th>
                    {TIME_SLOTS.map(slot => (
                      <th key={slot} className="px-1 py-3 text-center min-w-[60px] text-xs">{slot}</th>
                    ))}
                  </tr>
                </thead>
                <tbody className="divide-y divide-gray-100">
                  {users.map(user => {
                    const isMe = currentUser === user.name;
                    const isPublic = PUBLIC_NAMES.includes(user.name);
                    const canEdit = isMe || isPublic;
                    return (
                    <tr
                      key={user.id}
                      className="hover:bg-gray-100 transition-colors"
                    >
                      <td className="px-3 py-2">
                        <div className="flex items-center justify-center">
                          <div className={`w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-bold mr-2 shrink-0 ${user.avatarColor}`}>
                            {user.name[0]}
                          </div>
                          {/* 090909272727 - 본인 이름 밑줄 색상(decoration-indigo-400)을 원하는 색상으로 바꾸세요 */}
                          <span className={`font-semibold text-sm whitespace-nowrap ${user.gender === 'male' ? 'text-blue-900' : 'text-pink-900'} ${isMe ? 'underline decoration-2 decoration-indigo-400 underline-offset-2' : ''}`}>{user.name}</span>
                        </div>
                      </td>
                      {TIME_SLOTS.map(slot => {
                         const isSelected = dailyData[user.name]?.[slot];
                         const timeAllowed = isRegistrationAllowed(selectedDate, slot);
                         const allowed = timeAllowed && canEdit;
                         
                         let btnClass = "w-full h-10 rounded-lg flex items-center justify-center transition-all duration-200 active:scale-95 ";
                         
                         if (isSelected) {
                           btnClass += (user.gender === 'male' ? 'bg-blue-500 text-white shadow-sm' : 'bg-pink-500 text-white shadow-sm');
                           if (!timeAllowed) btnClass += " opacity-50";
                         } else {
                           btnClass += timeAllowed ? 'bg-gray-50 text-gray-300' : 'bg-gray-100 text-gray-200';
                         }

                         if (allowed) {
                           btnClass += ' hover:brightness-95 cursor-pointer';
                         } else {
                           btnClass += ' cursor-not-allowed';
                         }

                         return (
                           <td key={slot} className="p-1 text-center align-middle">
                             <button
                               onClick={() => allowed && onToggle(user.name, slot)}
                               disabled={!allowed}
                               title={!canEdit ? '본인만 신청할 수 있습니다' : (!timeAllowed ? '신청 마감' : '')}
                               className={btnClass}
                             >
                               {isSelected ? <Check size={18} strokeWidth={3} /> : <div className="w-1.5 h-1.5 rounded-full bg-gray-200" />}
                             </button>
                           </td>
                         );
                      })}
                    </tr>
                  )})}
                </tbody>
                <tfoot className="bg-gray-50 font-semibold text-gray-600 border-t border-gray-200">
                   <tr>
                     <td className="px-3 py-3 text-center text-xs">합계</td>
                     {TIME_SLOTS.map(slot => (
                       <td key={slot} className="text-center py-2 text-xs">
                         <div className="flex flex-col items-center justify-center">
                           <span className="text-gray-900 font-bold mb-0.5">{stats.slotStats[slot].total}</span>
                           <div className="flex gap-1 text-[9px] text-gray-400 font-normal">
                             <span className="text-blue-500">M:{stats.slotStats[slot].male}</span>
                             <span className="text-pink-500">F:{stats.slotStats[slot].female}</span>
                           </div>
                         </div>
                       </td>
                     ))}
                   </tr>
                </tfoot>
              </table>
            </div>
          </div>
        </div>
      );
    };

    // --- 로그인 모달 ---
    // step: 'select' (이름 선택) -> 'register' (PIN 최초 설정) | 'login' (PIN 입력)
    const LoginModal = ({ onClose, onLoginSuccess }) => {
      const [step, setStep] = useState('select');
      const [selectedName, setSelectedName] = useState(null);
      const [pin, setPin] = useState('');
      const [pinConfirm, setPinConfirm] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handleSelectName = async (name) => {
        setError('');
        setSelectedName(name);
        setLoading(true);
        try {
          const userSnap = await getDoc(doc(db, "users", name));
          if (userSnap.exists() && userSnap.data().pin) {
            setStep('login');
          } else {
            setStep('register');
          }
        } catch (e) {
          setError('사용자 정보를 불러오지 못했습니다.');
        } finally {
          setLoading(false);
        }
      };

      const handleRegister = async () => {
        setError('');
        if (!/^\d{4}$/.test(pin)) {
          setError('PIN은 숫자 4자리로 입력해주세요.');
          return;
        }
        if (pin !== pinConfirm) {
          setError('PIN이 서로 일치하지 않습니다.');
          return;
        }
        setLoading(true);
        try {
          await setDoc(doc(db, "users", selectedName), {
            pin,
            registeredAt: new Date().toISOString(),
          }, { merge: true });
          onLoginSuccess(selectedName);
        } catch (e) {
          setError('등록에 실패했습니다. 다시 시도해주세요.');
        } finally {
          setLoading(false);
        }
      };

      const handleLogin = async () => {
        setError('');
        setLoading(true);
        try {
          const userSnap = await getDoc(doc(db, "users", selectedName));
          if (userSnap.exists() && userSnap.data().pin === pin) {
            onLoginSuccess(selectedName);
          } else {
            setError('PIN이 일치하지 않습니다.');
            setPin('');
          }
        } catch (e) {
          setError('로그인에 실패했습니다. 다시 시도해주세요.');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="fixed inset-0 bg-black/40 z-50 flex items-end sm:items-center justify-center">
          <div className="bg-white w-full sm:w-96 sm:rounded-2xl rounded-t-2xl p-5 max-h-[85vh] flex flex-col">
            <div className="flex items-center justify-between mb-4">
              <h3 className="text-lg font-bold text-gray-900">
                {step === 'select' && '본인 이름을 선택하세요'}
                {step === 'register' && `${selectedName}님, PIN을 설정하세요`}
                {step === 'login' && `${selectedName}님, PIN을 입력하세요`}
              </h3>
              <button onClick={onClose} className="p-1 rounded-full hover:bg-gray-100 text-gray-400">
                <X size={20} />
              </button>
            </div>

            {step === 'select' && (
              <div className="overflow-y-auto flex-1 grid grid-cols-3 gap-2">
                {LOGIN_SELECTABLE_USERS.map(user => (
                  <button
                    key={user.id}
                    onClick={() => handleSelectName(user.name)}
                    disabled={loading}
                    className="flex flex-col items-center justify-center py-3 rounded-xl bg-gray-50 hover:bg-gray-100 transition-colors disabled:opacity-50"
                  >
                    <div className={`w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold mb-1 ${user.avatarColor}`}>
                      {user.name[0]}
                    </div>
                    <span className="text-xs font-semibold text-gray-700">{user.name}</span>
                  </button>
                ))}
              </div>
            )}

            {step === 'register' && (
              <div className="flex flex-col space-y-3">
                <input
                  type="password"
                  inputMode="numeric"
                  maxLength={4}
                  placeholder="새 PIN 4자리"
                  value={pin}
                  onChange={e => setPin(e.target.value.replace(/\D/g, ''))}
                  className="border border-gray-200 rounded-xl px-4 py-3 text-center text-xl tracking-[0.5em] focus:outline-none focus:ring-2 focus:ring-indigo-400"
                />
                <input
                  type="password"
                  inputMode="numeric"
                  maxLength={4}
                  placeholder="PIN 4자리 확인"
                  value={pinConfirm}
                  onChange={e => setPinConfirm(e.target.value.replace(/\D/g, ''))}
                  className="border border-gray-200 rounded-xl px-4 py-3 text-center text-xl tracking-[0.5em] focus:outline-none focus:ring-2 focus:ring-indigo-400"
                />
                {error && <p className="text-xs text-red-500">{error}</p>}
                <div className="flex gap-2 pt-1">
                  <button onClick={() => { setStep('select'); setPin(''); setPinConfirm(''); setError(''); }} className="flex-1 py-3 rounded-xl bg-gray-100 text-gray-600 font-semibold text-sm">
                    뒤로
                  </button>
                  <button onClick={handleRegister} disabled={loading} className="flex-1 py-3 rounded-xl bg-indigo-600 text-white font-semibold text-sm disabled:opacity-50">
                    {loading ? '처리중...' : '등록하고 시작하기'}
                  </button>
                </div>
              </div>
            )}

            {step === 'login' && (
              <div className="flex flex-col space-y-3">
                <input
                  type="password"
                  inputMode="numeric"
                  maxLength={4}
                  placeholder="PIN 4자리"
                  value={pin}
                  onChange={e => setPin(e.target.value.replace(/\D/g, ''))}
                  autoFocus
                  className="border border-gray-200 rounded-xl px-4 py-3 text-center text-xl tracking-[0.5em] focus:outline-none focus:ring-2 focus:ring-indigo-400"
                />
                {error && <p className="text-xs text-red-500">{error}</p>}
                <div className="flex gap-2 pt-1">
                  <button onClick={() => { setStep('select'); setPin(''); setError(''); }} className="flex-1 py-3 rounded-xl bg-gray-100 text-gray-600 font-semibold text-sm">
                    뒤로
                  </button>
                  <button onClick={handleLogin} disabled={loading || pin.length !== 4} className="flex-1 py-3 rounded-xl bg-indigo-600 text-white font-semibold text-sm disabled:opacity-50">
                    {loading ? '확인중...' : '로그인'}
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    };

    // --- Main App ---
    const App = () => {
      const [selectedDate, setSelectedDate] = useState(formatDate(new Date()));
      const [currentWeekStart, setCurrentWeekStart] = useState(new Date());
      const [registrations, setRegistrations] = useState({});
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          return localStorage.getItem('currentUser') || null;
        } catch (e) {
          return null;
        }
      });
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [dataLoading, setDataLoading] = useState(true);

      // 식사 신청 현황: 로그인 여부와 무관하게 항상 실시간으로 전체 공개.
      // 진입 시 데이터가 확실히 불러와지도록, 불러오기 전에는 "로딩중" 상태를 유지하고
      // 실시간 연결이 실패하면 자동으로 재연결을 시도한다.
      useEffect(() => {
        let cancelled = false;
        let retryTimer = null;
        const docRef = doc(db, "daily_meals", selectedDate);

        setDataLoading(true);

        const subscribe = () => {
          return onSnapshot(docRef, (docSnapshot) => {
            if (cancelled) return;
            setRegistrations(prev => ({ ...prev, [selectedDate]: docSnapshot.exists() ? docSnapshot.data() : {} }));
            setDataLoading(false); // 데이터가 정상적으로 도착했을 때만 로딩 해제
          }, (error) => {
            console.error("실시간 연결 실패, 3초 후 재시도:", error);
            // 연결 실패 시 로딩중 상태를 유지한 채로 재시도
            if (!cancelled) {
              retryTimer = setTimeout(() => {
                unsubscribeRef.current && unsubscribeRef.current();
                unsubscribeRef.current = subscribe();
              }, 3000);
            }
          });
        };

        const unsubscribeRef = { current: subscribe() };

        return () => {
          cancelled = true;
          if (retryTimer) clearTimeout(retryTimer);
          unsubscribeRef.current && unsubscribeRef.current();
        };
      }, [selectedDate]);

      const handlePrevWeek = () => {
        const newDate = new Date(currentWeekStart);
        newDate.setDate(newDate.getDate() - 7);
        setCurrentWeekStart(newDate);
      };

      const handleNextWeek = () => {
        const newDate = new Date(currentWeekStart);
        newDate.setDate(newDate.getDate() + 7);
        setCurrentWeekStart(newDate);
      };

      const toggleRegistration = async (userName, slot) => {
        // 본인이거나, 로그인 없이 누구나 신청 가능한 공용 계정(사감님/어머님)만 허용
        const canEdit = userName === currentUser || PUBLIC_NAMES.includes(userName);
        if (!canEdit) {
          return;
        }
        if (!isRegistrationAllowed(selectedDate, slot)) {
          alert('신청 마감 시간이 지났거나 신청 가능한 기간이 아닙니다.\n(당일 포함 7일 이내 신청 가능)');
          return;
        }

        const currentDailyData = registrations[selectedDate] || {};
        const isCurrentlySelected = currentDailyData[userName]?.[slot] || false;

        try {
          const docRef = doc(db, "daily_meals", selectedDate);
          await setDoc(docRef, {
            [userName]: {
              [slot]: !isCurrentlySelected
            }
          }, { merge: true });
          // onSnapshot 실시간 구독이 저장 직후 자동으로 화면을 갱신하므로 별도 처리 불필요
        } catch (error) {
          console.error("저장 실패:", error);
          alert("데이터 저장에 실패했습니다.");
        }
      };

      const handleLoginSuccess = (name) => {
        setCurrentUser(name);
        try {
          localStorage.setItem('currentUser', name);
        } catch (e) {
          console.error("로그인 정보 저장 실패:", e);
        }
        setShowLoginModal(false);
      };

      const handleLogout = () => {
        setCurrentUser(null);
        try {
          localStorage.removeItem('currentUser');
        } catch (e) {
          console.error("로그아웃 처리 실패:", e);
        }
      };

      return (
        <div className="min-h-screen bg-gray-50 pb-20 font-sans">
          {/* Header */}
          <header className="bg-white px-6 pt-12 pb-6 border-b sticky top-0 z-20 shadow-sm">
            <div className="flex items-start justify-between">
              <div>
                <h1 className="text-2xl font-extrabold text-gray-900">문경 학사 식사 신청</h1>
                <p className="text-xs text-gray-400 mt-1">2026학년도 1학기</p>
                <p className="text-xs text-gray-400 mt-1">* 식사 신청은 식사시간 2시간 전 마감됩니다.</p>
              </div>
              {currentUser ? (
                <div className="flex flex-col items-end shrink-0">
                  <div className="flex items-center gap-1 text-xs font-semibold text-indigo-600 bg-indigo-50 px-2.5 py-1.5 rounded-full mb-1">
                    <UserIcon size={12} />
                    {currentUser}
                  </div>
                  <button
                    onClick={handleLogout}
                    className="flex items-center gap-1 text-[11px] text-gray-400 hover:text-gray-600"
                  >
                    <LogOut size={12} /> 나가기
                  </button>
                </div>
              ) : (
                <button
                  onClick={() => setShowLoginModal(true)}
                  className="flex items-center gap-1 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 px-3 py-2 rounded-full shrink-0 transition-colors"
                >
                  <LogIn size={14} /> 로그인
                </button>
              )}
            </div>
          </header>

          {/* Calendar Strip */}
          <WeekCalendar
            selectedDate={selectedDate}
            onSelectDate={setSelectedDate}
            startDate={currentWeekStart}
            onPrevWeek={handlePrevWeek}
            onNextWeek={handleNextWeek}
          />

          {/* Main Content: 로그인 여부와 무관하게 전체 현황 항상 표시 */}
          <main className="max-w-md mx-auto px-4 py-6">
            {dataLoading && (
              <div className="mb-4 text-xs text-gray-400 bg-white border border-gray-100 rounded-xl px-3 py-2 text-center">
                신청 현황을 불러오는 중...
              </div>
            )}
            <DailyTable 
              users={USERS} 
              dailyData={registrations[selectedDate] || {}}
              selectedDate={selectedDate}
              onToggle={toggleRegistration}
              currentUser={currentUser}
            />
          </main>

          {showLoginModal && (
            <LoginModal
              onClose={() => setShowLoginModal(false)}
              onLoginSuccess={handleLoginSuccess}
            />
          )}
        </div>
      );
    };

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
